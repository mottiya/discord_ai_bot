# === Основные настройки ===
agents:
  ai1_user_id: 1111271721132109855   # Ваш ID для AI1
  ai2_user_id: 1075208730393706637   # Ваш ID для AI2

# === Активность ===
activity:
  daily_online_hours: 3.5
  sessions_per_day: 2
  min_session_minutes: 45
  max_session_minutes: 120
  # Интервалы ответов (в секундах, только внутри сессии)
  response_delay_min: 61    # = slowmode + 1
  response_delay_max: 90    # = slowmode + 30

# === Поведение с третьими лицами ===
interaction:
  max_stranger_replies: 3   # 2–5, как вы просили
  ignore_reset_hours: 4

# === Документация по серверам ===
servers:

  "1322177578852946063":       # ваш тестовый сервер
    docs_path: "docs/server_123456789"
    channel_id: 1322177578852946066
    slowmode_override: null
    always_online: true   # ← ОСТАВЬТЕ ЭТО НАВСЕГДА НЕТ always_online → будет обычное поведение
    

  # # Другие серверы — без always_online:
  # "987654321098765432":
  #   docs_path: "docs/server_987654321"
  #   slowmode_override: 0
  
  # "1322177578852946063":       # server_id    # это 1й  серв
  #   docs_path: "docs/server_123456789"
  #   channel_id: 1322177578852946066  # опционально
  #   slowmode_override: null   # null = авто, или укажите число (сек)  # определит слоумод сам

  # # "987654321098765432":
  # #   docs_path: "docs/server_987654321"
  # #   channel_id: 987654321098765432  # опционально   # это 2й серв
  # #   slowmode_override: 0      # без slowmode

# === AI-модель ===
ai:
  provider: "google"          # openai, anthropic, google, ollama
  model: "gemini-1.5-pro"             # или "claude-3-5-sonnet", "gemini-1.5-pro", "llama3.2, gpt-4o"